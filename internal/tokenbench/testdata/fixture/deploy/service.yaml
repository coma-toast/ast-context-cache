apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: api
          image: shop/api:latest
          env:
            - name: SHOP_RATE_LIMIT_RPS
              value: "100"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
