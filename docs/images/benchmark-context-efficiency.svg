<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .bg { fill: #121214; }
      .card { fill: #1c1c1f; stroke: #2c2c31; stroke-width: 1px; }
      .card-sub { fill: #26262b; stroke: #2c2c31; stroke-width: 1px; }
      .title { fill: #ececef; font-weight: 700; font-size: 19px; }
      .sub { fill: #9a9aa2; font-size: 12px; font-weight: 400; }
      .kpi-lbl { fill: #9a9aa2; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
      .kpi-val { font-weight: 800; font-size: 26px; }
      .kpi-sub { fill: #9a9aa2; font-size: 11px; }
      .good { fill: #4ade80; }
      .bad { fill: #f87171; }
      .accent { fill: #fb923c; }
      .blue { fill: #38bdf8; }
      .grid-line { stroke: #2c2c31; stroke-width: 1px; stroke-dasharray: 4 4; }
      .axis-label { fill: #9a9aa2; font-size: 11px; font-weight: 500; }
      .legend { fill: #ececef; font-size: 12px; font-weight: 500; }
      .badge-bg { fill: rgba(251, 146, 60, 0.15); stroke: rgba(251, 146, 60, 0.35); stroke-width: 1px; }
      .badge-text { fill: #fb923c; font-size: 11px; font-weight: 700; }
      .callout { fill: #ececef; font-size: 11px; font-weight: 500; }
    </style>
    <linearGradient id="astGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" rx="16" class="bg"/>
  <rect x="1" y="1" width="918" height="538" rx="15" fill="none" stroke="#2c2c31" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(28, 36)">
    <circle cx="6" cy="6" r="5" fill="#4ade80"/>
    <text x="20" y="10" class="title">Context Efficiency &amp; Agentic Benchmark</text>
    <rect x="408" y="-6" width="102" height="22" rx="11" class="badge-bg"/>
    <text x="459" y="9" text-anchor="middle" class="badge-text">v5.0.25 LIVE</text>
    <text x="0" y="30" class="sub">5-Turn Agentic Feature Synthesis (Megabonk 2D Survivors + Busey SVG) &bull; Tested on Qwen3.8-27B (MBP oMLX)</text>
  </g>

  <!-- 4 Top KPI Cards -->
  <g transform="translate(28, 88)">
    <!-- KPI 1 -->
    <rect width="202" height="80" rx="12" class="card"/>
    <text x="16" y="24" class="kpi-lbl">Prompt Token Reduction</text>
    <text x="16" y="54" class="kpi-val good">74.8%</text>
    <text x="16" y="70" class="kpi-sub">109,246 tokens saved</text>

    <!-- KPI 2 -->
    <rect x="220" width="202" height="80" rx="12" class="card"/>
    <text x="236" y="24" class="kpi-lbl">Context Compression</text>
    <text x="236" y="54" class="kpi-val" fill="#ececef">3.96x</text>
    <text x="236" y="70" class="kpi-sub">36.9k vs 146.1k prompt tok</text>

    <!-- KPI 3 -->
    <rect x="440" width="202" height="80" rx="12" class="card"/>
    <text x="456" y="24" class="kpi-lbl">Warm Query Latency</text>
    <text x="456" y="54" class="kpi-val blue">&lt; 25ms</text>
    <text x="456" y="70" class="kpi-sub">59ms cold embedder warmup</text>

    <!-- KPI 4 -->
    <rect x="660" width="204" height="80" rx="12" class="card"/>
    <text x="676" y="24" class="kpi-lbl">Local Model Gen Speed</text>
    <text x="676" y="54" class="kpi-val accent">22.4 <tspan font-size="14" font-weight="500" fill="#9a9aa2">TPS</tspan></text>
    <text x="676" y="70" class="kpi-sub">TTFT 1.2s &bull; KV pressure -75%</text>
  </g>

  <!-- Main Chart: Cumulative Context Window Trajectory -->
  <g transform="translate(28, 188)">
    <rect width="560" height="324" rx="14" class="card"/>
    <text x="20" y="28" fill="#ececef" font-size="14" font-weight="700">Cumulative Context Window Growth Curve</text>
    <text x="20" y="46" class="sub">Prompt token volume loaded into LLM context across 5 agentic build turns</text>

    <!-- Legend -->
    <g transform="translate(320, 20)">
      <line x1="0" y1="6" x2="18" y2="6" stroke="#f87171" stroke-width="2.5"/>
      <circle cx="9" cy="6" r="3.5" fill="#f87171"/>
      <text x="24" y="10" class="legend" fill="#f87171">Baseline</text>

      <line x1="104" y1="6" x2="122" y2="6" stroke="#4ade80" stroke-width="3"/>
      <circle cx="113" cy="6" r="4" fill="#4ade80"/>
      <text x="128" y="10" class="legend good">ast-context-cache</text>
    </g>

    <!-- Graph Grid Area (Width: 480, Height: 200, from x: 50, y: 75 to x: 530, y: 275) -->
    <!-- Y: 0 -> 275, 50k -> 225, 100k -> 175, 150k -> 125, 160k -> 115 -->
    <line x1="50" y1="125" x2="530" y2="125" class="grid-line"/>
    <text x="42" y="129" text-anchor="end" class="axis-label">150k</text>

    <line x1="50" y1="175" x2="530" y2="175" class="grid-line"/>
    <text x="42" y="179" text-anchor="end" class="axis-label">100k</text>

    <line x1="50" y1="225" x2="530" y2="225" class="grid-line"/>
    <text x="42" y="229" text-anchor="end" class="axis-label">50k</text>

    <line x1="50" y1="275" x2="530" y2="275" stroke="#2c2c31" stroke-width="1.5"/>
    <text x="42" y="279" text-anchor="end" class="axis-label">0</text>

    <!-- X coordinates: Turn 1: 85, Turn 2: 185, Turn 3: 285, Turn 4: 395, Turn 5: 505 -->
    <!-- Baseline trajectory:
         T1 (Orient): 5,235 tok -> y: 270
         T2 (Search): 5,973 tok -> y: 269
         T3 (Systems): 6,163 tok -> y: 269
         T4 (Blast Radius): 64,791 tok -> y: 210
         T5 (Handoff): 146,136 tok -> y: 129
    -->
    <polygon points="85,275 85,270 185,269 285,269 395,210 505,129 505,275" fill="url(#baseGrad)"/>
    <polyline points="85,270 185,269 285,269 395,210 505,129" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="270" r="3.5" fill="#f87171"/>
    <circle cx="185" cy="269" r="3.5" fill="#f87171"/>
    <circle cx="285" cy="269" r="3.5" fill="#f87171"/>
    <circle cx="395" cy="210" r="4.5" fill="#f87171"/>
    <circle cx="505" cy="129" r="5" fill="#f87171"/>
    <text x="505" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">146.1k</text>

    <!-- AST trajectory:
         T1: 13,786 tok -> y: 261
         T2: 14,004 tok -> y: 261
         T3: 15,212 tok -> y: 260
         T4: 28,788 tok -> y: 246
         T5: 36,890 tok -> y: 238
    -->
    <polygon points="85,275 85,261 185,261 285,260 395,246 505,238 505,275" fill="url(#astGrad)"/>
    <polyline points="85,261 185,261 285,260 395,246 505,238" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="261" r="3.5" fill="#4ade80"/>
    <circle cx="185" cy="261" r="3.5" fill="#4ade80"/>
    <circle cx="285" cy="260" r="3.5" fill="#4ade80"/>
    <circle cx="395" cy="246" r="4.5" fill="#4ade80"/>
    <circle cx="505" cy="238" r="5.5" fill="#4ade80" stroke="#121214" stroke-width="1.5"/>
    <text x="505" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#4ade80">36.9k (-74.8%)</text>

    <!-- X Axis Labels -->
    <text x="85" y="295" text-anchor="middle" class="axis-label">Turn 1</text>
    <text x="85" y="307" text-anchor="middle" font-size="9" fill="#9a9aa2">(Orient)</text>

    <text x="185" y="295" text-anchor="middle" class="axis-label">Turn 2</text>
    <text x="185" y="307" text-anchor="middle" font-size="9" fill="#9a9aa2">(Search)</text>

    <text x="285" y="295" text-anchor="middle" class="axis-label">Turn 3</text>
    <text x="285" y="307" text-anchor="middle" font-size="9" fill="#9a9aa2">(Features)</text>

    <text x="395" y="295" text-anchor="middle" class="axis-label">Turn 4</text>
    <text x="395" y="307" text-anchor="middle" font-size="9" fill="#9a9aa2">(Blast Radius)</text>

    <text x="505" y="295" text-anchor="middle" class="axis-label">Turn 5</text>
    <text x="505" y="307" text-anchor="middle" font-size="9" fill="#9a9aa2">(Handoff)</text>
  </g>

  <!-- Side Cards: Tool Efficiency Breakdown -->
  <g transform="translate(604, 188)">
    <rect width="288" height="324" rx="14" class="card"/>
    <text x="18" y="28" fill="#ececef" font-size="14" font-weight="700">Efficiency by Capability</text>
    <text x="18" y="46" class="sub">Where the 109k tokens were saved</text>

    <!-- Breakdown 1: Impact Graph -->
    <g transform="translate(18, 64)">
      <rect width="252" height="74" rx="10" class="card-sub"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#ececef">Blast Radius &amp; Safety</text>
      <text x="238" y="22" text-anchor="end" font-size="12" font-weight="800" class="good">95.0% Saved</text>
      <text x="14" y="40" font-size="10" fill="#9a9aa2">58.6k &rarr; 6.7k tok &bull; get_impact_graph</text>
      <!-- Progress Bar -->
      <rect x="14" y="52" width="224" height="6" rx="3" fill="#1c1c1f"/>
      <rect x="14" y="52" width="213" height="6" rx="3" fill="#4ade80"/>
    </g>

    <!-- Breakdown 2: Virtual Context & Handoff -->
    <g transform="translate(18, 148)">
      <rect width="252" height="74" rx="10" class="card-sub"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#ececef">Compaction &amp; Handoff</text>
      <text x="238" y="22" text-anchor="end" font-size="12" font-weight="800" class="good">64.5% Saved</text>
      <text x="14" y="40" font-size="10" fill="#9a9aa2">22.7k &rarr; 8.1k tok &bull; store_context</text>
      <!-- Progress Bar -->
      <rect x="14" y="52" width="224" height="6" rx="3" fill="#1c1c1f"/>
      <rect x="14" y="52" width="144" height="6" rx="3" fill="#38bdf8"/>
    </g>

    <!-- Breakdown 3: Exploration & Skeleton -->
    <g transform="translate(18, 232)">
      <rect width="252" height="74" rx="10" class="card-sub"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#ececef">Skeleton Code Context</text>
      <text x="238" y="22" text-anchor="end" font-size="12" font-weight="800" class="good">76.5% Saved</text>
      <text x="14" y="40" font-size="10" fill="#9a9aa2">Signatures without bodies &bull; auto mode</text>
      <!-- Progress Bar -->
      <rect x="14" y="52" width="224" height="6" rx="3" fill="#1c1c1f"/>
      <rect x="14" y="52" width="171" height="6" rx="3" fill="#fb923c"/>
    </g>
  </g>
</svg>
